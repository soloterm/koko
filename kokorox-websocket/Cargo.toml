[package]
name = "kokorox-websocket"
version = "0.2.1"
edition = "2021"
repository = "https://github.com/soloterm/koko.git"
homepage = "https://github.com/soloterm/koko"
authors = ["Solo Terminal, Inc.", "Lucas Jin", "Tommy Falkowski"]
description = "WebSocket server for the Solo-maintained Kokoro TTS fork"
license = "GPL-3.0-only"

[dependencies]
kokorox = { path = "../kokorox" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
futures-util = "0.3"
tokio = { version = "1.49", features = ["io-util", "net", "rt", "macros"] }
tokio-tungstenite = "0.21"
uuid = { version = "1.0", features = ["v4"] }
