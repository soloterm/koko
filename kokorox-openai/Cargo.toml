[package]
name = "kokorox-openai"
version = "0.2.1"
edition = "2021"
repository = "https://github.com/soloterm/koko.git"
homepage = "https://github.com/soloterm/koko"
authors = ["Solo Terminal, Inc.", "Lucas Jin", "Tommy Falkowski"]
description = "OpenAI-compatible server for the Solo-maintained Kokoro TTS fork"
license = "GPL-3.0-only"

[dependencies]
kokorox = { path = "../kokorox" }

axum = { version = "0.7", features = ["http2"] }
serde = { version = "1.0", features = ["derive"] }
tower-http = { version = "0.5", features = ["cors"] }
