[package]
name = "koko"
version = "0.2.1"
edition = "2021"
repository = "https://github.com/soloterm/koko.git"
homepage = "https://github.com/soloterm/koko"
authors = ["Solo Terminal, Inc.", "Lucas Jin", "Tommy Falkowski"]
description = "Solo-maintained fork of the Kokoro text-to-speech CLI"
license = "GPL-3.0-only"

[package.metadata.wix]
upgrade-guid = "336CE5A3-EB28-4A3A-A4C0-477194EBD0F6"
path-guid = "05092137-AFB8-436C-9F40-EE8B9866D6ED"
license = false
eula = false

[dependencies]
kokorox = { path = "../kokorox" }
kokorox-openai = { path = "../kokorox-openai" }
kokorox-websocket = { path = "../kokorox-websocket" }

clap = { version = "4.5.60", features = ["derive"] }
tokio = { version = "1.49", features = ["io-util", "io-std", "rt-multi-thread"] }
sentence_segmentation = "1.2.0"
rodio = "0.21.1"
ctrlc = "3.4.1"
regex = "1.10.3"
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
dirs = "6.0"
shellexpand = "3.1"

[features]
default = []
cuda = ["kokorox/cuda"]
coreml = ["kokorox/coreml"]
