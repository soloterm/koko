name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libopus-dev libasound2-dev

      - name: Enforce formatting (PRs)
        if: github.event_name == 'pull_request'
        run: cargo fmt --all --check

      - name: Auto-format (main pushes)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo fmt --all

      - name: Auto-commit formatting changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply rustfmt [skip ci]"
          git push

      - name: Clippy
        run: cargo clippy -p koko --all-targets --no-deps -- -D warnings

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config opus

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libopus-dev libasound2-dev

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
