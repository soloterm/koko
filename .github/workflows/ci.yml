name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # rustsec/audit-check reports findings as a check run.
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci-${{ runner.os }}-v1

      - name: Install deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libopus-dev libasound2-dev

      - name: Enforce formatting (PRs)
        if: github.event_name == 'pull_request'
        run: cargo fmt --all --check

      - name: Auto-format (main pushes)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo fmt --all

      - name: Auto-commit formatting changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply rustfmt [skip ci]"
          git push

      - name: Clippy
        run: cargo clippy -p koko --all-targets --no-deps -- -D warnings

  test-posix:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: test
          - os: macos-latest
            mode: check
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci-${{ runner.os }}-v1

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config opus

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libopus-dev libasound2-dev

      - name: Run tests (Linux)
        if: matrix.mode == 'test'
        run: cargo test -p koko --locked

      - name: Compile check (macOS)
        if: matrix.mode == 'check'
        run: cargo check -p koko --locked

  test-windows:
    if: github.event_name == 'push'
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci-${{ runner.os }}-v1

      # ort-sys 2.0.0-rc.11 copies onnxruntime DLLs into {examples,deps} three levels above
      # OUT_DIR without creating them. Under Cargo's newer build-dir layout
      # (build/<pkg>/<hash>/out) that resolves to target/<profile>/build; under the older one
      # (build/<pkg>-<hash>/out) to target/<profile>. Create both so the copy fallback works.
      - name: Prepare ort-sys DLL directories (Windows)
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path target/debug/examples, target/debug/deps, target/debug/build/examples, target/debug/build/deps | Out-Null

      - name: Compile check (Windows)
        run: cargo check -p koko --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci-${{ runner.os }}-v1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
