name: Release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., v1.2.3)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
    steps:
      - id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid tag '$TAG'. Expected prefix 'v' and a valid version-like suffix."
            exit 1
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

  source:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package corresponding source
        id: package
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.prepare.outputs.release_tag }}"
          ARCHIVE_ROOT="koko-source-${TAG}"
          ARCHIVE_NAME="${ARCHIVE_ROOT}.tar.gz"

          # Bundle tracked source and build-relevant files, excluding CI workflow config.
          git archive --format=tar \
            --prefix="${ARCHIVE_ROOT}/" \
            HEAD \
            -- \
            . \
            ':(exclude).github/**' \
            | gzip -n > "${ARCHIVE_NAME}"

          shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload source release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          files: |
            ${{ steps.package.outputs.archive_name }}
            ${{ steps.package.outputs.archive_name }}.sha256

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            name: koko-aarch64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: koko-x86_64-unknown-linux-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: koko-x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config opus

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libopus-dev libasound2-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/koko

      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          KEYCHAIN_PASSWORD="ci-temp-password"
          BINARY="target/${{ matrix.target }}/release/koko"
          NOTARY_PASSWORD="${APPLE_PASSWORD:-${APPLE_APP_PASSWORD:-}}"

          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ] || [ -z "${APPLE_SIGNING_IDENTITY:-}" ] || [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${NOTARY_PASSWORD:-}" ]; then
            echo "Missing required Apple signing/notarization secrets."
            echo "Required: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_TEAM_ID, and APPLE_PASSWORD (or APPLE_APP_PASSWORD)."
            exit 1
          fi

          trap 'security delete-keychain build.keychain || true; rm -f cert.p12 koko-notarize.zip' EXIT

          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security find-identity -v -p codesigning build.keychain

          codesign --force --options runtime --timestamp \
            --keychain build.keychain \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "$BINARY"
          codesign --verify --deep --strict --verbose=2 "$BINARY"
          codesign -dvv "$BINARY"

          ditto -c -k --sequesterRsrc --keepParent "$BINARY" koko-notarize.zip
          xcrun notarytool submit koko-notarize.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait

          # "stapler" only supports app bundles, pkg, and dmg artifacts.
          # For a standalone CLI executable, notarization acceptance + Gatekeeper
          # assessment are the correct checks.
          echo "Skipping stapler for standalone CLI binary: $BINARY"

          set +e
          SPCTL_OUTPUT="$(spctl --assess --type execute --verbose=4 "$BINARY" 2>&1)"
          SPCTL_EXIT=$?
          set -e
          echo "$SPCTL_OUTPUT"
          if [ "$SPCTL_EXIT" -ne 0 ] && ! echo "$SPCTL_OUTPUT" | grep -q "does not seem to be an app"; then
            exit "$SPCTL_EXIT"
          fi

      - name: Sign (Windows)
        if: runner.os == 'Windows'
        run: |
          # TODO: Add Windows code signing via AzureSignTool or signtool
          echo "Windows signing placeholder"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi

          cp target/${{ matrix.target }}/release/koko${EXT} dist/
          cp LICENSE dist/
          if [ -f NOTICE ]; then cp NOTICE dist/; fi

          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../${{ matrix.name }}.zip *
          else
            tar czf ../${{ matrix.name }}.tar.gz *
          fi

      - name: Generate checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $file = "${{ matrix.name }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $file).Hash.ToLower()
          "$hash  $file" | Out-File -FilePath "${{ matrix.name }}.sha256" -Encoding ascii

      - name: Generate checksums (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          files: |
            ${{ matrix.name }}.*

      - name: Upload artifacts for manifest
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.name }}.*

  verify-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*apple-darwin
          merge-multiple: true

      - name: Verify checksums and macOS trust
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          archives=(koko-*apple-darwin.tar.gz)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No macOS archives found to verify."
            ls -la
            exit 1
          fi

          for archive in "${archives[@]}"; do
            echo "Verifying archive: $archive"

            checksum_file="${archive%.tar.gz}.sha256"
            if [ ! -f "$checksum_file" ]; then
              echo "Missing checksum file: $checksum_file"
              exit 1
            fi

            shasum -a 256 -c "$checksum_file"

            extract_dir="$(mktemp -d)"
            tar xzf "$archive" -C "$extract_dir"

            binary="$extract_dir/koko"
            if [ ! -f "$binary" ]; then
              echo "Missing binary inside archive: $binary"
              ls -la "$extract_dir"
              exit 1
            fi

            if [ ! -f "$extract_dir/LICENSE" ]; then
              echo "Missing LICENSE inside archive."
              exit 1
            fi

            if [ ! -f "$extract_dir/NOTICE" ]; then
              echo "Missing NOTICE inside archive."
              exit 1
            fi

            chmod +x "$binary"

            echo "codesign verification: $archive"
            codesign --verify --deep --strict --verbose=2 "$binary"
            codesign -dvv "$binary"

            echo "spctl assessment: $archive"
            set +e
            SPCTL_OUTPUT="$(spctl --assess --type execute --verbose=4 "$binary" 2>&1)"
            SPCTL_EXIT=$?
            set -e
            echo "$SPCTL_OUTPUT"
            if [ "$SPCTL_EXIT" -ne 0 ] && ! echo "$SPCTL_OUTPUT" | grep -q "does not seem to be an app"; then
              exit "$SPCTL_EXIT"
            fi

            rm -rf "$extract_dir"
          done

  manifest:
    needs:
      - prepare
      - build
      - verify-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Generate manifest
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.prepare.outputs.release_tag }}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, tag: $tag, generated_at: $generated_at, artifacts: []}' > manifest.json

          for checksum_file in *.sha256; do
            artifact_name="$(awk '{print $2}' "$checksum_file")"
            sha256="$(awk '{print $1}' "$checksum_file")"

            target="${artifact_name#koko-}"
            target="${target%.tar.gz}"
            target="${target%.zip}"

            manifest_tmp="$(mktemp)"
            jq \
              --arg name "$artifact_name" \
              --arg target "$target" \
              --arg url "$BASE_URL/$artifact_name" \
              --arg sha256 "$sha256" \
              '.artifacts += [{name: $name, target: $target, url: $url, sha256: $sha256}]' \
              manifest.json > "$manifest_tmp"
            mv "$manifest_tmp" manifest.json
          done

          jq '.artifacts |= sort_by(.target)' manifest.json > manifest.sorted.json
          mv manifest.sorted.json manifest.json

      - name: Upload manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          files: manifest.json
